<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わんグル バナー①横長</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; background: transparent; }

    .banner {
      display: block;
      width: 100%;
      max-width: 1200px;
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      box-shadow: 0 6px 28px rgba(255,140,105,0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .banner:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(255,140,105,0.5);
    }
    .banner img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <a href="https://nishiyan24.github.io/wanguru-stamp-lp/" target="_blank" class="banner">
    <img src="assets/stamplp-banner-wide.png?v=2" alt="あなたの愛犬が世界に一つだけのスタンプに！期間限定無料プレゼント | わんグル">
  </a>
  <script>
    function sendHeight() {
      var h = document.body.scrollHeight;
      window.parent.postMessage({ iframeHeight: h }, '*');
    }
    window.addEventListener('load', sendHeight);
    window.addEventListener('resize', sendHeight);
  </script>
</body>
</html>
