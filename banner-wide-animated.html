<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わんグル バナー横長アニメーション</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; background: transparent; }

    :root {
      --main:      #FF8C69;
      --main-dark: #E06A45;
      --accent:    #A8D5A2;
      --text:      #4A3728;
    }

    @keyframes pulse-badge {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.06); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    @keyframes btn-shine {
      0%        { left: -80px; opacity: 0; }
      15%       { opacity: 1; }
      60%, 100% { left: 110%; opacity: 0; }
    }
    @keyframes pulse-bg {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.7; }
    }

    .banner {
      width: 100%;
      max-width: 1200px;
      background: linear-gradient(135deg, #FFF8F0 0%, #FFE8D6 55%, #FFCFB8 100%);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 28px 40px;
      position: relative;
      box-shadow: 0 8px 32px rgba(255,140,105,0.3);
      text-decoration: none;
      color: var(--text);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      gap: 28px;
    }
    .banner:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 44px rgba(255,140,105,0.45);
    }
    .banner::before {
      content: '';
      position: absolute;
      top: -50px; left: -50px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(168,213,162,0.18);
      pointer-events: none;
      animation: pulse-bg 5s ease-in-out infinite;
    }
    .banner::after {
      content: '';
      position: absolute;
      bottom: -60px; right: 200px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255,140,105,0.10);
      pointer-events: none;
      animation: pulse-bg 6s ease-in-out 1s infinite;
    }

    /* リボン */
    .ribbon-wrap {
      position: absolute;
      top: 0; right: 0;
      width: 90px; height: 90px;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }
    .ribbon {
      position: absolute;
      top: 18px; right: -24px;
      width: 120px;
      background: var(--main-dark);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 900;
      text-align: center;
      padding: 4px 0;
      transform: rotate(45deg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      letter-spacing: 0.05em;
    }

    /* 左：画像 */
    .banner__img {
      flex-shrink: 0;
      width: 170px;
      position: relative;
      z-index: 1;
    }
    .banner__img img {
      width: 100%;
      mix-blend-mode: multiply;
      animation: float 3.8s ease-in-out 0.8s infinite;
    }

    /* 中央：テキスト */
    .banner__body {
      flex: 1;
      position: relative;
      z-index: 1;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--main-dark);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 50px;
      box-shadow: 0 3px 10px rgba(224,106,69,0.35);
      margin-bottom: 10px;
      animation: pulse-badge 2.5s ease-in-out infinite;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .title .accent { color: var(--main-dark); }
    .checks {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .checks span {
      background: rgba(168,213,162,0.4);
      color: #3a6e35;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 50px;
    }

    /* 右：ボタン */
    .banner__cta {
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--main), var(--main-dark));
      color: #fff;
      font-size: 1rem;
      font-weight: 900;
      padding: 16px 28px;
      border-radius: 50px;
      white-space: nowrap;
      box-shadow: 0 5px 18px rgba(255,140,105,0.45);
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      top: 0; left: -80px;
      width: 60px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: btn-shine 3.5s ease-in-out 2s infinite;
    }
  </style>
</head>
<body>
  <a href="https://dognavi.com/stamp-campaign/" target="_blank" class="banner">
    <div class="ribbon-wrap">
      <div class="ribbon">期間限定</div>
    </div>
    <div class="banner__img">
      <img src="assets/stamp-hero-3.png" alt="愛犬のオリジナルスタンプサンプル">
    </div>
    <div class="banner__body">
      <div class="badge">🎀 無料プレゼント実施中！</div>
      <p class="title">
        あなたの愛犬が<br>
        <span class="accent">世界に一つだけのスタンプ</span>になる！
      </p>
      <div class="checks">
        <span>✅ 完全無料</span>
        <span>✅ 写真1枚でOK</span>
        <span>✅ 申込み60秒</span>
      </div>
    </div>
    <div class="banner__cta">
      <div class="btn">🎁 今すぐ無料で作る ▶</div>
    </div>
  </a>
  <script>
    function sendHeight() {
      var banner = document.querySelector('.banner');
      var h = banner ? Math.ceil(banner.getBoundingClientRect().height) : document.body.scrollHeight;
      window.parent.postMessage({ iframeHeight: h }, '*');
    }
    window.addEventListener('load', sendHeight);
    window.addEventListener('resize', sendHeight);
  </script>
</body>
</html>
